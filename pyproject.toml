[project]
name = "python-example"
version = "0.1.0"
description = ""
authors = [
    {name = "przemek@sagalo.pro"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]
classifiers = [
    "License :: Other/Proprietary License",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if settings.DEBUG",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W", "B", "UP", "C90"]
lint.ignore = []

[tool.pyright]
typeCheckingMode = "basic"
reportUnreachable = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
